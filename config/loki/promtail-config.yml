server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /positions/positions.yaml

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: localhost
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      # Docker json logs are never rotated; after a recreate Promtail
      # would replay months of history. Loki rejects entries older than 7d
      # and then drops the whole batch (including fresh lines).
      - drop:
          older_than: 168h
          drop_counter_reason: too_old
      - regex:
          source: filename
          expression: "/var/lib/docker/containers/(?P<container_id>[^/]+)/"
      - labels:
          container_id:
